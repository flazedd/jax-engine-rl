    episode_length: 128
    inventory_penalty: 0.05
    gamma: 0.99
    reset_inventory_range: 0
    n_regimes: 3
    transition_matrix:
    - 0.98
    - 0.01
    - 0.01
    - 0.01
    - 0.98
    - 0.01
    - 0.01
    - 0.01
    - 0.98
    regime_p_tight_bid: &id001
    - 0.44
    - 0.64
    - 0.52
    regime_p_wide_bid: &id002
    - 0.404
    - 0.164
    - 0.152
    regime_p_tight_ask: *id001
    regime_p_wide_ask: *id002
    initial_distribution:
    - 0.333
    - 0.333
    - 0.334
