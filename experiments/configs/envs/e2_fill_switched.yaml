# E2 — Regime-switching directional fill intensities.
#
# Three regimes:
#   0 (noise) — symmetric fills, same as E0 baseline.
#   1 (bull)  — customer buy pressure: ask fills readily, bid rarely.
#   2 (bear)  — customer sell pressure: bid fills readily, ask rarely.
#
# The direction matters, not just the magnitude, so per-regime optimal
# actions differ (R1) and each fill strongly disambiguates the regime (R4).
env:
  name: mm_reduced
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.01
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    # Diagonal-dominant: expected regime length ≈ 50 steps → roughly
    # 2.5 regime transitions per 128-step episode.
    transition_matrix: [
      0.98, 0.01, 0.01,
      0.01, 0.98, 0.01,
      0.01, 0.01, 0.98,
    ]
    # Regime 0 (noise): symmetric.
    # Regime 1 (bull):  bid low, ask high.
    # Regime 2 (bear):  bid high, ask low.
    regime_p_tight_bid: [0.6, 0.2, 0.9]
    regime_p_wide_bid:  [0.2, 0.05, 0.4]
    regime_p_tight_ask: [0.6, 0.9, 0.2]
    regime_p_wide_ask:  [0.2, 0.4, 0.05]
    initial_distribution: [0.333, 0.333, 0.334]
