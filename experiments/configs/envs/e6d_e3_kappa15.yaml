# E6d — Option 3 (strong): E3 with κ=0.15 (15× E3's inv penalty).
#
# Pushes the inv-penalty-as-decoupler hypothesis to the limit. At κ=0.15,
# being at q=±5 costs 0.15·25=3.75 per step — larger than the per-step
# capture in any regime. The agent strictly prefers inv=0. Whether it can
# actually achieve inv=0 in directional regimes is the question; if not,
# the per-regime returns simply collapse and the gap may not widen.
env:
  name: market_making_v1
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.15
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    transition_matrix: [
      0.98, 0.01, 0.01,
      0.01, 0.98, 0.01,
      0.01, 0.01, 0.98,
    ]
    regime_p_tight_bid: [0.60, 0.10, 0.75]
    regime_p_wide_bid:  [0.20, 0.02, 0.30]
    regime_p_tight_ask: [0.60, 0.95, 0.20]
    regime_p_wide_ask:  [0.20, 0.60, 0.05]
    initial_distribution: [0.333, 0.333, 0.334]
