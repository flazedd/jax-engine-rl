# E_cartpole_v1, wide-reference candidate — the easy level of both difficulty
# axes at once: asymmetry-easy fills (0.98 / 0.20) with persistence-easy
# dynamics (diag = 0.99). The single-axis levels each leave the other axis at
# medium, so neither maximises the spread between the three reference levels.
# Screened by scripts.cartpole_instance_screen for the appendix instance.
env:
  name: cartpole_regime_v1
  params:
    episode_length: 128
    gamma: 0.99
    angular_velocity_noise_std: 0.2

    n_regimes: 3
    regime_action_success: [
      0.98, 0.20,
      0.80, 0.80,
      0.20, 0.98,
    ]
    transition_matrix: [
      0.990, 0.005, 0.005,
      0.005, 0.990, 0.005,
      0.005, 0.005, 0.990,
    ]
    initial_distribution: [0.333, 0.333, 0.334]
