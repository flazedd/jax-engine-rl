# M6 — distinguishability sweep, hard level (v2).
#
# Replaces the original hard cell, which failed R3 and R4 because the
# per-regime contrast was so narrow that no method had a positive
# optimal envelope to recover. This cell widens the contrast just
# enough to give a non-degenerate envelope and to clear R2 at the
# diagnostic 40-iter PPO budget, while staying clearly narrower than
# medium (tight=.30,.80,.50 wide=.65,.05,.02), so the cell remains
# harder than medium.
env:
  name: market_making_v1
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.05
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    transition_matrix: [
      0.98, 0.01, 0.01,
      0.01, 0.98, 0.01,
      0.01, 0.01, 0.98,
    ]
    regime_p_tight_bid: [0.30, 0.78, 0.50]
    regime_p_wide_bid:  [0.62, 0.05, 0.02]
    regime_p_tight_ask: [0.30, 0.78, 0.50]
    regime_p_wide_ask:  [0.62, 0.05, 0.02]
    initial_distribution: [0.333, 0.333, 0.334]
