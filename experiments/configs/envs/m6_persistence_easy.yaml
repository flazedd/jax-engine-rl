# M6 — persistence sweep, easy level.
#
# Same fills as E_final, only the transition matrix differs:
# diag = 0.995, off-diag = 0.0025 → mean regime duration ≈ 200 steps,
# longer than the 128-step episode. In practice each episode sees one
# regime almost the entire way through; Belief-PPO should approach the
# Oracle ceiling because there is essentially no inference uncertainty.
env:
  name: market_making_v1
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.05
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    transition_matrix: [
      0.9950, 0.0025, 0.0025,
      0.0025, 0.9950, 0.0025,
      0.0025, 0.0025, 0.9950,
    ]
    regime_p_tight_bid: [0.30, 0.80, 0.50]
    regime_p_wide_bid:  [0.65, 0.05, 0.02]
    regime_p_tight_ask: [0.30, 0.80, 0.50]
    regime_p_wide_ask:  [0.65, 0.05, 0.02]
    initial_distribution: [0.333, 0.333, 0.334]
