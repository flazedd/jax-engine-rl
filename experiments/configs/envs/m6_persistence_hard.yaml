# M6 — persistence sweep, hard level.
#
# Same fills as E_final, transition matrix has diag = 0.80,
# off-diag = 0.10 → mean regime duration ≈ 5 steps. Each 128-step
# episode sees ~25 regime changes, so a method must infer the current
# regime from a very short observation window before it switches again.
env:
  name: market_making_v1
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.05
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    transition_matrix: [
      0.80, 0.10, 0.10,
      0.10, 0.80, 0.10,
      0.10, 0.10, 0.80,
    ]
    regime_p_tight_bid: [0.30, 0.80, 0.50]
    regime_p_wide_bid:  [0.65, 0.05, 0.02]
    regime_p_tight_ask: [0.30, 0.80, 0.50]
    regime_p_wide_ask:  [0.65, 0.05, 0.02]
    initial_distribution: [0.333, 0.333, 0.334]
