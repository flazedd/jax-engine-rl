# M6 — persistence sweep, hard level (v2 candidate).
#
# Replaces the original diag=0.80 hard cell, which failed R4 (the
# analytical posterior could not concentrate at all under such fast
# switching). This cell targets diag=0.96, which is meaningfully
# harder than medium (diag=0.98) while leaving the inference problem
# soluble: mean regime duration ~25 steps vs medium's ~50, so the
# inference cost grows but does not dominate the optimal envelope.
env:
  name: market_making_v1
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.05
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    transition_matrix: [
      0.96, 0.02, 0.02,
      0.02, 0.96, 0.02,
      0.02, 0.02, 0.96,
    ]
    regime_p_tight_bid: [0.30, 0.80, 0.50]
    regime_p_wide_bid:  [0.65, 0.05, 0.02]
    regime_p_tight_ask: [0.30, 0.80, 0.50]
    regime_p_wide_ask:  [0.65, 0.05, 0.02]
    initial_distribution: [0.333, 0.333, 0.334]
