# M6 — persistence sweep, hard level.
#
# Same fills as E_final, transition matrix has diag = 0.85,
# off-diag = 0.075 → mean regime duration ≈ 7 steps.
# Regimes switch frequently within an episode, so a method must
# infer the current regime quickly from a short observation window.
env:
  name: market_making_v1
  params:
    inventory_max: 5
    episode_length: 128
    inventory_penalty: 0.05
    gamma: 0.99
    reset_inventory_range: 0

    n_regimes: 3
    transition_matrix: [
      0.850, 0.075, 0.075,
      0.075, 0.850, 0.075,
      0.075, 0.075, 0.850,
    ]
    regime_p_tight_bid: [0.30, 0.80, 0.50]
    regime_p_wide_bid:  [0.65, 0.05, 0.02]
    regime_p_tight_ask: [0.30, 0.80, 0.50]
    regime_p_wide_ask:  [0.65, 0.05, 0.02]
    initial_distribution: [0.333, 0.333, 0.334]
