# Per-regime PPO: N separate networks, each trained with the env's
# `lock_regime` fixed to a different regime. The training entrypoint
# detects agent.name == ppo_per_regime and sweeps over n_regimes,
# training one instance per regime under a matched iteration budget.
#
# Matched compute: every locked-regime instance gets the same iteration
# count and parallel-env count as oracle/belief/regime_agnostic — not
# 1/N of them. Per `docs/milestones/contingency.md` → M3.
extends:
  - base/base_ppo.yaml
  - envs/e_final.yaml
experiment_name: m3_per_regime
agent:
  name: ppo_per_regime
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 5
seed_base: 0
