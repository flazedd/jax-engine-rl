# M4 → M5 bridge: VariBAD on MM E_final at mid budget.
#
# Sanity check that the M4-validated VariBAD implementation runs end-to-end
# on the actual MM env. MM has continuous PnL rewards, so the reward
# decoder head is overridden to Gaussian (fixed-σ NLL == MSE up to const).
#
# Reference levels on this env (from M3, full budget): regime_agnostic=136.2,
# belief=168.5, oracle=180.1.
extends:
  - base/base_varibad.yaml
  - envs/e_final.yaml
experiment_name: m4_bridge_varibad_mm
iterations: 100
parallel_envs: 256
rollout_length: 128
num_seeds: 1
seed_base: 0
agent:
  params:
    reward_decoder: gaussian
