# Smoke-test: VariBAD with exploration bonus on bandit.
extends:
  - base/base_varibad.yaml
experiment_name: m5_factorial_smoke_varibad_bonus
env:
  name: bandit
  params:
    n_arms: 5
    episode_length: 30
iterations: 5
parallel_envs: 16
rollout_length: 30
num_seeds: 1
seed_base: 0
agent:
  params:
    exploration_bonus: true
    exploration_bonus_coef: 0.1
    exploration_bonus_window: 16
