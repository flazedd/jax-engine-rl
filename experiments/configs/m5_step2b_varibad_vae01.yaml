# M5 Step-2b ablation: VariBAD with vae_coef=0.1 — 10× weaker VAE auxiliary.
# Paired with vae0.yaml to read the vae_coef → learning-curve-slope trend.
extends:
  - base/base_varibad.yaml
  - envs/e_final.yaml
experiment_name: m5_step2b_varibad_vae01
iterations: 50
parallel_envs: 512
rollout_length: 128
num_seeds: 1
seed_base: 0
agent:
  params:
    reward_decoder: gaussian
    vae_coef: 0.1
