extends:
- m5r_base/varibad_concat.yaml
experiment_name: m5r_locked_varibad_concat_PLACEHOLDER
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 12
seed_base: 0
agent:
  params:
    integration: concat
    reward_decoder: gaussian
    hidden_dim: 20
    latent_dim: 2
    policy_trunk_layers: 2
    policy_trunk_hidden: 20
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
    kl_coef: 0.1
    belief_layernorm: false
