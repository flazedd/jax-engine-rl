extends:
- m5r_base/rl2_concat.yaml
- envs/e_final.yaml
experiment_name: m5r_matched_rl2_concat
iterations: 300
parallel_envs: 512
rollout_length: 128
num_seeds: 20
seed_base: 0
agent:
  params:
    integration: concat
    hidden_dim: 25
    policy_trunk_layers: 1
    policy_trunk_hidden: 17
    policy_obs_dim: 11
    concat_policy_reads_obs: true
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
    belief_layernorm: false
