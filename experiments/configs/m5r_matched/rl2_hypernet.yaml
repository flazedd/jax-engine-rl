extends:
- m5r_base/rl2_hypernet.yaml
- envs/e_final.yaml
experiment_name: m5r_final_rl2_hypernet_e_final
iterations: 600
parallel_envs: 512
rollout_length: 128
num_seeds: 20
seed_base: 0
agent:
  params:
    integration: hypernet
    hidden_dim: 25
    policy_trunk_layers: 1
    policy_trunk_hidden: 17
    hypernet_target_hidden: 4
    hypernet_hidden: 7
    hypernet_init_scale: 0.01
    policy_obs_dim: 11
    concat_policy_reads_obs: true
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
