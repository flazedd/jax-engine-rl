extends:
- m5r_base/varibad_hypernet.yaml
- envs/e_final.yaml
experiment_name: m5r_matched_varibad_hypernet
iterations: 300
parallel_envs: 512
rollout_length: 128
num_seeds: 20
seed_base: 0
agent:
  params:
    integration: hypernet
    reward_decoder: gaussian
    hidden_dim: 17
    latent_dim: 2
    policy_trunk_layers: 1
    policy_trunk_hidden: 96
    hypernet_target_hidden: 4
    hypernet_hidden: 4
    hypernet_init_scale: 0.01
    policy_obs_dim: 11
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
    kl_coef: 0.1
    recon_window: 1
    decoder_obs_dim: 11
