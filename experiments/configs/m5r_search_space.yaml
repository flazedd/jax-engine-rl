# M5R fair-tune search space — single source of truth for the tuning protocol.
#
# The runner (scripts/m5r_tune.py) reads this file, draws `trials_per_cell`
# random samples per cell, materialises a per-trial YAML that extends the
# cell's base config with the sampled knob values, and runs train_or_sweep
# in `trial_run_mode` (default --mid). Selection metric is the mean of
# `mean_return_per_iter` over the last 50 iterations of training; tie-break
# is the lower variance over the last 50 iterations.
#
# Pre-registered: this file is committed to git BEFORE any tuning run.
# The `search_seed` is the substantive pre-registration — it determines
# the exact sequence of trials drawn per cell. Changing any field below
# after a run begins constitutes a new experiment, not a continuation.
#
# Matched-compute design: hidden_dim, latent_dim, and policy_trunk_* are
# pinned in the m5r_base configs so total parameter count sits at roughly
# 5k (the 4,932-5,380 band) for every cell. They are not searched here; only the
# optimisation knobs (LR, ent_coef, max_grad_norm, kl_coef, layernorm,
# init_scale) are.

search_seed: 20260506
trials_per_cell: 30
trial_run_mode: mid              # 100 iter × 256 envs × 1 seed
selection_window: 50             # last N iters used for selection metric

cells:
  rl2_concat:
    base_config: m5r_base/rl2_concat.yaml
    knobs:
      agent.params.learning_rate:
        dist: log_uniform
        low:  1.0e-5
        high: 1.0e-3
      agent.params.ent_coef:
        dist: log_uniform
        low:  1.0e-4
        high: 1.0e-1
      agent.params.max_grad_norm:
        dist: log_uniform
        low:  0.1
        high: 5.0
      agent.params.belief_layernorm:
        dist: choice
        values: [true, false]

  rl2_hypernet:
    base_config: m5r_base/rl2_hypernet.yaml
    knobs:
      agent.params.learning_rate:
        dist: log_uniform
        low:  1.0e-5
        high: 1.0e-3
      agent.params.ent_coef:
        dist: log_uniform
        low:  1.0e-4
        high: 1.0e-1
      agent.params.max_grad_norm:
        dist: log_uniform
        low:  0.1
        high: 5.0
      agent.params.hypernet_init_scale:
        dist: choice
        values: [0.0, 1.0e-3, 1.0e-2]

  varibad_concat:
    base_config: m5r_base/varibad_concat.yaml
    knobs:
      agent.params.learning_rate:
        dist: log_uniform
        low:  1.0e-5
        high: 1.0e-3
      agent.params.ent_coef:
        dist: log_uniform
        low:  1.0e-4
        high: 1.0e-1
      agent.params.max_grad_norm:
        dist: log_uniform
        low:  0.1
        high: 5.0
      agent.params.kl_coef:
        dist: log_uniform
        low:  1.0e-3
        high: 1.0
      agent.params.belief_layernorm:
        dist: choice
        values: [true, false]

  varibad_hypernet:
    base_config: m5r_base/varibad_hypernet.yaml
    knobs:
      agent.params.learning_rate:
        dist: log_uniform
        low:  1.0e-5
        high: 1.0e-3
      agent.params.ent_coef:
        dist: log_uniform
        low:  1.0e-4
        high: 1.0e-1
      agent.params.max_grad_norm:
        dist: log_uniform
        low:  0.1
        high: 5.0
      agent.params.kl_coef:
        dist: log_uniform
        low:  1.0e-3
        high: 1.0
      agent.params.hypernet_init_scale:
        dist: choice
        values: [0.0, 1.0e-3, 1.0e-2]
