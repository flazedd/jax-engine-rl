# RL² concat on CartPoleRegimeV1 at the matched budget.
# The encoder width is shared with rl2_hypernet.yaml so the pair differs only
# in the conditioning architecture; policy_trunk_hidden absorbs the budget.
extends:
- base/base_rl2.yaml
- envs/e_cartpole_v1.yaml
experiment_name: m_cartpole_matched_rl2_concat
iterations: 300
parallel_envs: 512
rollout_length: 128
num_seeds: 20
seed_base: 0
agent:
  params:
    integration: concat
    hidden_dim: 25
    policy_trunk_layers: 1
    policy_trunk_hidden: 28
    policy_obs_dim: 4
    concat_policy_reads_obs: true
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
