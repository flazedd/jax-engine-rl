# RL² hypernet on CartPoleRegimeV1 at the matched budget.
# Encoder width identical to rl2_concat.yaml.
extends:
- base/base_rl2.yaml
- envs/e_cartpole_v1_spread.yaml
experiment_name: m_cartpole_matched_rl2_hypernet
iterations: 2000
parallel_envs: 512
rollout_length: 128
num_seeds: 20
seed_base: 0
agent:
  params:
    integration: hypernet
    hidden_dim: 27
    policy_trunk_layers: 1
    policy_trunk_hidden: 7
    hypernet_target_hidden: 4
    hypernet_hidden: 4
    hypernet_init_scale: 0.01
    policy_obs_dim: 4
    concat_policy_reads_obs: true
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
