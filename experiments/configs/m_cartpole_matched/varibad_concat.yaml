# VariBAD concat on CartPoleRegimeV1 at the matched budget.
# Encoder and reward decoder identical to varibad_hypernet.yaml.
extends:
- base/base_varibad.yaml
- envs/e_cartpole_v1.yaml
experiment_name: m_cartpole_matched_varibad_concat
iterations: 300
parallel_envs: 512
rollout_length: 128
num_seeds: 20
seed_base: 0
agent:
  params:
    integration: concat
    reward_decoder: gaussian
    hidden_dim: 21
    latent_dim: 2
    policy_trunk_layers: 2
    policy_trunk_hidden: 22
    policy_obs_dim: 4
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
    kl_coef: 0.1
