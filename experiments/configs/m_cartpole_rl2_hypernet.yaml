# Second-POMDP external-validity probe — RL² with hypernet integration on
# CartPoleRegimeV1. Matched-compute (~5k params) and seed protocol mirror
# m5r_locked/rl2_hypernet.yaml.
extends:
  - base/base_rl2.yaml
  - envs/e_cartpole_v1.yaml
experiment_name: m_cartpole_rl2_hypernet
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 12
seed_base: 0
agent:
  params:
    integration: hypernet
    hidden_dim: 24
    hypernet_target_hidden: 4
    hypernet_hidden: 8
    hypernet_init_scale: 0.01
    policy_trunk_layers: 0
    policy_trunk_hidden: 0
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
