# Second-POMDP external-validity probe — VariBAD with concat integration on
# CartPoleRegimeV1. Matched-compute (~5k params) and seed protocol mirror
# rsmm_legacy/varibad_concat.yaml.
#
# Note on reward_decoder: cartpole reward is bounded {0, 1} per step rather
# than the continuous PnL of MM, but Gaussian is kept here to mirror the
# M5R setup exactly so the cross-env comparison is clean.
extends:
  - base/base_varibad.yaml
  - envs/e_cartpole_v1.yaml
experiment_name: m_cartpole_varibad_concat
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 12
seed_base: 0
agent:
  params:
    integration: concat
    reward_decoder: gaussian
    hidden_dim: 20
    latent_dim: 2
    policy_trunk_layers: 2
    policy_trunk_hidden: 20
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
    kl_coef: 0.1
    belief_layernorm: false
