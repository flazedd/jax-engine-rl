# M5R fair-tune base — RL² concat on the held-out tuning environment.
# hidden_dim is locked here (not searched) so the cell sits at ~5k
# parameters, the matched-compute target shared with the references.
extends:
  - base/base_rl2.yaml
  - envs/rsmm_tuning.yaml
experiment_name: m5r_tune_rl2_concat_base
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 1
seed_base: 0
agent:
  params:
    integration: concat
    hidden_dim: 27
    policy_trunk_layers: 0
    policy_trunk_hidden: 0
