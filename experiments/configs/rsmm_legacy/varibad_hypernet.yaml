extends:
- rsmm_base/varibad_hypernet.yaml
experiment_name: m5r_locked_varibad_hypernet_PLACEHOLDER
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 12
seed_base: 0
agent:
  params:
    integration: hypernet
    reward_decoder: gaussian
    hidden_dim: 18
    latent_dim: 2
    hypernet_target_hidden: 4
    hypernet_hidden: 8
    hypernet_init_scale: 0.01
    policy_trunk_layers: 2
    policy_trunk_hidden: 18
    learning_rate: 3.0e-4
    ent_coef: 0.01
    max_grad_norm: 0.5
    kl_coef: 0.1
