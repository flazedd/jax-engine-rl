# 3-simplex-belief ablation (pure-RL control): RL2 concat, medium env.
# Same 3-dim softmax belief head, but trained only from the RL return
# (aux_decode_coef = 0), so the belief is not supervised. Probe the simplex to
# see whether it self-calibrates; a stall with a dirty belief is the catch-22.
extends:
- rsmm_legacy/rl2_concat.yaml
- envs/e_final.yaml
experiment_name: m5r_simplex_rl2_concat_simplex_rl
agent:
  params:
    belief_simplex_head: true
    aux_decode_coef: 0.0
    n_regimes: 3
    belief_key: belief_simplex
