# Small-budget probe: VariBAD concat at ~5k parameters.
extends:
  - base/base_varibad.yaml
  - envs/e_final.yaml
experiment_name: m5r_smallbudget_varibad_concat
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 8
seed_base: 0
agent:
  params:
    integration: concat
    reward_decoder: gaussian
    hidden_dim: 20
    latent_dim: 2
    policy_trunk_layers: 2
    policy_trunk_hidden: 20
