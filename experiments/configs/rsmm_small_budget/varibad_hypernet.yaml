# Small-budget probe: VariBAD hypernet at ~5k parameters.
extends:
  - base/base_varibad.yaml
  - envs/e_final.yaml
experiment_name: m5r_smallbudget_varibad_hypernet
iterations: 200
parallel_envs: 512
rollout_length: 128
num_seeds: 8
seed_base: 0
agent:
  params:
    integration: hypernet
    reward_decoder: gaussian
    hidden_dim: 18
    latent_dim: 2
    hypernet_target_hidden: 4
    hypernet_hidden: 8
    hypernet_init_scale: 0.01
    policy_trunk_layers: 2
    policy_trunk_hidden: 18
