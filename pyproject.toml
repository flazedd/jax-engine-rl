[project]
name = "jax-engine-rl"
version = "0.2.0"
description = "Analytical market making MDP with HMM regime switching"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["numpy", "matplotlib", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lob_sim"]
