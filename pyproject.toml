[project]
name = "jax-engine-rl"
version = "0.1.0"
description = "Blazing fast JAX engine limit order book simulator for training RL agents"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["jax", "jaxlib", "matplotlib", "pytest", "optax", "distrax", "equinox"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lob_sim"]
