[project]
name = "thesis"
version = "0.1.0"
description = "Belief-conditioned meta-RL for regime-switching market making (TU Delft MSc thesis)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "flax==0.10.2",
    "optax==0.2.4",
    "chex==0.1.88",
    "numpy==2.1.3",
    "pyyaml==6.0.2",
    "matplotlib==3.10.0",
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "envs",
    "training",
    "plotting",
    "utils",
    "scripts",
]
